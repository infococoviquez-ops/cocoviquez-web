<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- A real 404 page, served with a real 404 status. Previously every unknown
         URL was rewritten to the homepage and answered 200, which search engines
         treat as "soft 404s" and may index as duplicates of the homepage. -->
    <meta name="robots" content="noindex" />
    <title>Página no encontrada | Restaurante Coco Víquez</title>
    <link rel="icon" type="image/png" href="/logo/favicon.png" />
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #0D1721; color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; text-align: center; }
      main { max-width: 440px; }
      img { width: 180px; height: auto; margin-bottom: 28px; }
      p.tag { margin: 0 0 8px; color: #F27F57; font-size: 12px; font-weight: 800; letter-spacing: 3px; text-transform: uppercase; }
      h1 { margin: 0 0 14px; font-size: 26px; }
      p { margin: 0 0 28px; color: rgba(255, 255, 255, .72); line-height: 1.55; }
      a { display: inline-block; padding: 14px 30px; background: #F27F57; color: #fff; border-radius: 999px; text-decoration: none; font-weight: 800; letter-spacing: 1px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/logo/logo.webp" alt="Restaurante Coco Víquez" />
      <p class="tag">Error 404</p>
      <h1>Esta página no existe</h1>
      <p>Puede que el enlace esté mal escrito o que la página se haya movido. Desde el inicio podés ver el menú, reservar mesa o pedir para llevar.</p>
      <a href="/">Volver al inicio</a>
    </main>
  </body>
</html>
